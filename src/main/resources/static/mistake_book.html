<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生词本 - 单词管家</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .header h1 { color: #667eea; }
        .back-btn {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s;
        }
        .back-btn:hover { background: #764ba2; }
        .stats-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .stats-number {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
        }
        .stats-label { color: #666; margin-top: 8px; }
        .words-list {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .word-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #eee;
            transition: background 0.2s;
        }
        .word-item:hover { background: #f5f7ff; }
        .word-item:last-child { border-bottom: none; }
        .word-info { flex: 1; }
        .word-content { font-size: 20px; font-weight: bold; color: #333; }
        .word-translation { color: #666; margin-top: 4px; }
        .word-actions { display: flex; gap: 10px; }
        .action-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn-review { background: #667eea; color: white; }
        .btn-review:hover { background: #764ba2; }
        .btn-remove { background: #f44336; color: white; }
        .btn-remove:hover { background: #d32f2f; }
        .empty-state {
            text-align: center;
            padding: 50px;
            color: #999;
        }
        .loading { text-align: center; padding: 40px; color: #666; }

        /* 复习卡片弹窗 */
        .review-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .review-overlay.show { display: flex; }
        .review-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .review-progress {
            color: #999;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .review-word {
            font-size: 36px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        .review-phonetic {
            font-size: 18px;
            color: #999;
            margin-bottom: 20px;
        }
        .review-pos {
            background: #f0f2ff;
            color: #667eea;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .review-translation {
            font-size: 24px;
            color: #555;
            margin-bottom: 10px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 10px;
        }
        .review-familiarity {
            font-size: 14px;
            color: #999;
            margin-bottom: 30px;
        }
        .review-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .review-btn {
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            max-width: 180px;
        }
        .review-btn-known {
            background: #4caf50;
            color: white;
        }
        .review-btn-known:hover { background: #388e3c; }
        .review-btn-unfamiliar {
            background: #ff9800;
            color: white;
        }
        .review-btn-unfamiliar:hover { background: #e68900; }
        .review-btn-close {
            background: #eee;
            color: #666;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }
        .review-btn-exit {
            background: none;
            border: none;
            color: #999;
            font-size: 14px;
            cursor: pointer;
            margin-top: 12px;
            padding: 6px 16px;
            text-decoration: underline;
        }
        .review-btn-exit:hover { color: #f44336; }
        .review-complete {
            padding: 30px;
        }
        .review-complete h2 {
            font-size: 28px;
            color: #667eea;
            margin-bottom: 15px;
        }
        .review-complete p {
            font-size: 18px;
            color: #666;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📕 生词本</h1>
        <a href="dashboard.html" class="back-btn">← 返回首页</a>
    </div>

    <div class="stats-card">
        <div class="stats-number" id="totalCount">0</div>
        <div class="stats-label">生词总数</div>
        <button class="action-btn btn-review" id="startReviewBtn" onclick="startReview()" style="margin-top: 12px; padding: 10px 30px; font-size: 16px; display: none;">开始复习</button>
    </div>

    <div class="words-list" id="wordsList">
        <div class="loading">加载中...</div>
    </div>
</div>

<!-- 复习卡片弹窗 -->
<div class="review-overlay" id="reviewOverlay">
    <div class="review-card" id="reviewContent">
        <div class="review-progress" id="reviewProgress"></div>
        <div class="review-word" id="reviewWord"></div>
        <div class="review-phonetic" id="reviewPhonetic"></div>
        <div class="review-pos" id="reviewPos"></div>
        <div class="review-translation" id="reviewTranslation"></div>
        <div class="review-familiarity" id="reviewFam"></div>
        <div class="review-actions" id="reviewActions">
            <button class="review-btn review-btn-known" onclick="reviewKnown()">✓ 认识</button>
            <button class="review-btn review-btn-unfamiliar" onclick="reviewUnfamiliar()">✗ 不认识</button>
        </div>
        <button class="review-btn-exit" onclick="closeReview()">结束复习</button>
        <div id="reviewDetailLink" style="margin-top: 6px;"></div>
    </div>
</div>

<!-- 单词详情弹窗 -->
<div id="detailModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 3000; justify-content: center; align-items: center;">
    <div style="background: white; border-radius: 15px; max-width: 600px; width: 90%; display: flex; flex-direction: column; max-height: 80vh;">
        <div style="padding: 20px 30px 0 30px; flex-shrink: 0;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2 style="color: #667eea;">📖 单词详情</h2>
                <span onclick="closeDetailModal()" style="cursor: pointer; font-size: 28px; color: #999;">&times;</span>
            </div>
            <div id="detailWordTitle" style="margin-top: 8px; font-size: 24px; font-weight: bold; color: #333;"></div>
            <div id="detailPhonetic" style="color: #999; font-size: 14px; font-style: italic; margin-top: 4px;"></div>
        </div>
        <div style="overflow-y: auto; padding: 0 30px 20px 30px;">
            <div id="detailContent"></div>
            <div id="detailButtons" style="margin-top: 20px; text-align: center;">
                <button onclick="closeDetailModal()" style="padding: 12px 40px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer;">返回复习</button>
            </div>
        </div>
    </div>
</div>

<script>
    let currentUser = null;
    let mistakeWords = [];
    // 复习状态
    let reviewList = [];
    let reviewIndex = 0;
    let reviewTotal = 0;
    let reviewKnownCount = 0;

    window.onload = async () => {
        currentUser = getCurrentUser();
        if (!currentUser) return;
        await loadMistakeWords();
    };

    function getCurrentUser() {
        const userStr = localStorage.getItem('currentUser');
        if (!userStr) {
            alert('请先登录');
            window.location.href = '/login.html';
            return null;
        }
        try {
            return JSON.parse(userStr);
        } catch(e) {
            return null;
        }
    }

    async function loadMistakeWords() {
        try {
            const response = await fetch(`/api/mistake/list?userId=${currentUser.userId}`);
            const result = await response.json();

            if (result.code === 200) {
                mistakeWords = result.data || [];
                document.getElementById('totalCount').textContent = mistakeWords.length;
                document.getElementById('startReviewBtn').style.display = mistakeWords.length > 0 ? 'inline-block' : 'none';
                renderMistakeWords();
            } else {
                showError('加载失败：' + (result.message || '未知错误'));
            }
        } catch (err) {
            console.error(err);
            showError('网络错误，请稍后重试');
        }
    }

    function renderMistakeWords() {
        const container = document.getElementById('wordsList');

        if (mistakeWords.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <h3>太棒了！</h3>
                    <p>你的生词本是空的，继续保持！</p>
                </div>
            `;
            return;
        }

        container.innerHTML = mistakeWords.map(item => `
            <div class="word-item" id="wordRow_${item.wordId}">
                <div class="word-info">
                    <div class="word-content">${item.word.content}</div>
                    <div class="word-translation">${item.word.translation}</div>
                </div>
                <div class="word-actions">
                    <button class="action-btn btn-review" onclick="startReview('${item.wordId}')">复习</button>
                    <button class="action-btn btn-remove" onclick="removeWord('${item.wordId}', '${item.word.content}')">移除</button>
                </div>
            </div>
        `).join('');
    }

    // ---- 复习卡片逻辑 ----
    async function startReview(startWordId) {
        // 加载生词本复习列表（含熟悉度）
        try {
            const resp = await fetch(`/api/mistake/review/list?userId=${currentUser.userId}`);
            const result = await resp.json();
            if (result.code !== 200) { alert('加载失败'); return; }
            reviewList = result.data || [];
        } catch(e) {
            alert('网络错误');
            return;
        }

        if (reviewList.length === 0) return;

        // 如果指定了起始单词，从该单词开始
        reviewIndex = startWordId ? reviewList.findIndex(w => w.wordId === startWordId) : 0;
        if (reviewIndex < 0) reviewIndex = 0;
        reviewTotal = reviewList.length;
        reviewKnownCount = 0;

        document.getElementById('reviewOverlay').classList.add('show');
        showReviewCard();
    }

    function showReviewCard() {
        if (reviewIndex >= reviewTotal) {
            showReviewComplete();
            return;
        }

        const word = reviewList[reviewIndex];
        document.getElementById('reviewProgress').textContent = `第 ${reviewIndex + 1} / ${reviewTotal} 个`;
        document.getElementById('reviewWord').textContent = word.content;
        document.getElementById('reviewPhonetic').textContent = word.phonetic || '';
        document.getElementById('reviewPos').textContent = word.partOfSpeech || '';
        document.getElementById('reviewPos').style.display = word.partOfSpeech ? 'inline-block' : 'none';
        document.getElementById('reviewTranslation').textContent = word.translation;
        document.getElementById('reviewFam').textContent = `当前熟悉度：${Math.min(Math.round(word.familiarity), 100)}%`;
        document.getElementById('reviewActions').style.display = 'flex';
        // 添加"看看单词详情"链接
        document.getElementById('reviewDetailLink').innerHTML =
            `<button onclick="showDetail('${word.wordId}')" style="background: none; border: none; color: #999; font-size: 13px; cursor: pointer; text-decoration: underline; padding: 2px 8px;">🤔 不太记得了？去看看单词详情</button>`;
    }

    async function reviewKnown() {
        const word = reviewList[reviewIndex];
        try {
            const resp = await fetch('/api/mistake/review/known', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: currentUser.userId, wordId: word.wordId })
            });
            const result = await resp.json();
            if (result.code === 200) {
                word.familiarity = result.newFamiliarity;
            }
        } catch(e) {}

        reviewKnownCount++;
        // 从列表和页面上移除
        const row = document.getElementById(`wordRow_${word.wordId}`);
        if (row) row.remove();
        reviewIndex++;
        showReviewCard();
    }

    async function reviewUnfamiliar() {
        const word = reviewList[reviewIndex];
        try {
            const resp = await fetch('/api/mistake/review/unfamiliar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: currentUser.userId, wordId: word.wordId })
            });
            const result = await resp.json();
            if (result.code === 200) {
                word.familiarity = result.newFamiliarity;
            }
        } catch(e) {}

        reviewIndex++;
        showReviewCard();
    }

    function showReviewComplete() {
        document.getElementById('reviewProgress').textContent = '';
        document.getElementById('reviewWord').textContent = '';
        document.getElementById('reviewPhonetic').textContent = '';
        document.getElementById('reviewPos').textContent = '';
        document.getElementById('reviewTranslation').textContent = '';
        document.getElementById('reviewFam').textContent = '';
        document.getElementById('reviewActions').style.display = 'none';
        document.getElementById('reviewContent').innerHTML = `
            <div class="review-complete">
                <h2>复习完成！</h2>
                <p>本次复习了 ${reviewTotal} 个生词，${reviewKnownCount} 个已掌握。</p>
                <p>继续加油！</p>
                <button class="review-btn-close" onclick="closeReview()">关闭</button>
            </div>
        `;
    }

    function closeReview() {
        document.getElementById('reviewOverlay').classList.remove('show');
        document.getElementById('reviewContent').innerHTML = `
            <div class="review-progress" id="reviewProgress"></div>
            <div class="review-word" id="reviewWord"></div>
            <div class="review-phonetic" id="reviewPhonetic"></div>
            <div class="review-pos" id="reviewPos"></div>
            <div class="review-translation" id="reviewTranslation"></div>
            <div class="review-familiarity" id="reviewFam"></div>
            <div class="review-actions" id="reviewActions">
                <button class="review-btn review-btn-known" onclick="reviewKnown()">认识</button>
                <button class="review-btn review-btn-unfamiliar" onclick="reviewUnfamiliar()">不认识</button>
            </div>
            <button class="review-btn-exit" onclick="closeReview()">结束复习</button>
            <div id="reviewDetailLink" style="margin-top: 6px;"></div>
        `;
        loadMistakeWords();
    }

    // ---- 原有移除功能 ----
    async function removeWord(wordId, wordContent) {
        if (!confirm(`确定要从生词本中移除"${wordContent}"吗？\n若移除将认为您已经熟悉该单词`)) {
            return;
        }

        try {
            const response = await fetch('/api/mistake/remove', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: currentUser.userId,
                    wordId: wordId
                })
            });
            const result = await response.json();

            if (result.code === 200) {
                // 直接移除DOM元素，不重新加载
                const row = document.getElementById(`wordRow_${wordId}`);
                if (row) row.remove();
                mistakeWords = mistakeWords.filter(w => w.wordId !== wordId);
                document.getElementById('totalCount').textContent = mistakeWords.length;
                if (mistakeWords.length === 0) {
                    document.getElementById('startReviewBtn').style.display = 'none';
                    document.getElementById('wordsList').innerHTML = `
                        <div class="empty-state">
                            <h3>太棒了！</h3>
                            <p>你的生词本是空的，继续保持！</p>
                        </div>
                    `;
                }
            } else {
                alert('移除失败：' + (result.message || '未知错误'));
            }
        } catch (err) {
            console.error(err);
            alert('网络错误');
        }
    }

    function showError(message) {
        document.getElementById('wordsList').innerHTML = `
            <div class="empty-state" style="color: #d32f2f;">
                <h3>加载失败</h3>
                <p>${message}</p>
            </div>
        `;
    }

    // ---- 单词详情功能 ----
    async function showDetail(wordId) {
        try {
            const resp = await fetch(`/api/words/get?wordId=${wordId}&userId=${currentUser.userId}`);
            const result = await resp.json();
            if (result.code !== 200 || !result.data) { alert('获取详情失败'); return; }
            const word = result.data;

            document.getElementById('detailWordTitle').textContent = word.content;
            document.getElementById('detailPhonetic').textContent = word.phonetic || '';

            let detailHTML = `
                <div style="background: #f5f5f5; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                    <div style="font-size: 14px; color: #666; margin-bottom: 5px;">词性</div>
                    <div style="font-size: 18px; color: #333;">${getPartOfSpeechText(word.partOfSpeech)}</div>
                </div>
                <div style="background: #f5f5f5; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                    <div style="font-size: 14px; color: #666; margin-bottom: 5px;">释义</div>
                    <div style="font-size: 18px; color: #333; line-height: 1.6;">${word.translation}</div>
                </div>
                <div style="background: #f5f5f5; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                    <div style="font-size: 14px; color: #666; margin-bottom: 5px;">发音</div>
                    <div style="font-size: 18px; color: #333; font-style: italic;">${word.phonetic || '暂无'}</div>
                </div>
                <div style="background: #f5f5f5; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                    <div style="font-size: 14px; color: #666; margin-bottom: 5px;">熟悉度</div>
                    <div style="background: #e0e0e0; border-radius: 10px; height: 20px; overflow: hidden;">
                        <div style="background: linear-gradient(to right, #667eea, #764ba2); height: 100%; width: ${Math.min(Math.round(word.familiarity), 100)}%; transition: width 0.3s;"></div>
                    </div>
                    <div style="text-align: center; margin-top: 5px; color: #667eea; font-weight: bold;">${Math.min(Math.round(word.familiarity), 100)}%</div>
                </div>
            `;

            // 如果有短语，显示短语
            if (word.phrases) {
                try {
                    const phrases = JSON.parse(word.phrases);
                    if (phrases && phrases.length > 0) {
                        detailHTML += `<div style="background: #f5f5f5; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                            <div style="font-size: 14px; color: #666; margin-bottom: 10px; font-weight: bold;">📝 常用短语（${phrases.length}个）</div>`;
                        phrases.forEach((p, i) => {
                            detailHTML += `<div style="padding: 10px; margin-bottom: 8px; background: white; border-radius: 6px; border-left: 3px solid #667eea;">
                                <div style="font-size: 16px; color: #333;">${i + 1}. ${p.phrase || p}</div>
                                ${p.translation ? `<div style="font-size: 14px; color: #666;">${p.translation}</div>` : ''}
                            </div>`;
                        });
                        detailHTML += `</div>`;
                    }
                } catch(e) {}
            }

            // 如果有例句，显示例句
            if (word.sentences) {
                try {
                    const sentences = JSON.parse(word.sentences);
                    if (sentences && sentences.length > 0) {
                        detailHTML += `<div style="background: #f5f5f5; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                            <div style="font-size: 14px; color: #666; margin-bottom: 10px; font-weight: bold;">💬 例句（${sentences.length}个）</div>`;
                        sentences.forEach((s, i) => {
                            detailHTML += `<div style="padding: 10px; margin-bottom: 8px; background: white; border-radius: 6px; border-left: 3px solid #764ba2;">
                                <div style="font-size: 16px; color: #333;">${i + 1}. ${s.sentence || s}</div>
                                ${s.translation ? `<div style="font-size: 14px; color: #666;">${s.translation}</div>` : ''}
                            </div>`;
                        });
                        detailHTML += `</div>`;
                    }
                } catch(e) {}
            }

            document.getElementById('detailContent').innerHTML = detailHTML;
            document.getElementById('detailModal').style.display = 'flex';
        } catch (e) {
            console.error(e);
            alert('网络错误');
        }
    }

    function closeDetailModal() {
        document.getElementById('detailModal').style.display = 'none';
    }

    function getPartOfSpeechText(pos) {
        if (!pos) return '';
        const texts = {
            'NOUN': 'NOUN（名词）', 'VERB': 'VERB（动词）', 'ADJECTIVE': 'ADJECTIVE（形容词）',
            'ADVERB': 'ADVERB（副词）', 'PREPOSITION': 'PREPOSITION（介词）', 'CONJUNCTION': 'CONJUNCTION（连词）',
            'PRONOUN': 'PRONOUN（代词）', 'INTERJECTION': 'INTERJECTION（感叹词）',
            'ARTICLE': 'ARTICLE（冠词）', 'ABBREVIATION': 'ABBREVIATION（缩写）',
            'AUXILIARY': 'AUXILIARY（助动词）', 'NUMERAL': 'NUMERAL（数词）', 'MODAL VERB': 'MODAL VERB（情态动词）'
        };
        if (pos.includes('/')) return pos.split('/').map(p => texts[p.trim()] || p).join('/');
        return texts[pos] || pos;
    }
</script>
</body>
</html>
