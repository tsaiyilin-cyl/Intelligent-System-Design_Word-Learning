<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词管家 - 用户登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e8ba3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 气泡背景 */
        .bubbles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .bubble {
            position: absolute;
            bottom: -100px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float-up linear infinite;
        }

        @keyframes float-up {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-120vh) rotate(720deg);
                opacity: 0;
            }
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 1;
        }

        /* 眼睛动画容器 */
        .eyes-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
        }

        .eye {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .pupil {
            width: 25px;
            height: 25px;
            background: #1e3c72;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.1s ease-out;
        }

        .pupil::after {
            content: '';
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            right: 3px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 5px;
            text-align: center;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .register-link a {
            color: #667eea;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="bubbles" id="bubbles"></div>

    <div class="login-container">
        <div class="eyes-container">
            <div class="eye">
                <div class="pupil"></div>
            </div>
            <div class="eye">
                <div class="pupil"></div>
            </div>
        </div>

        <div class="login-header">
            <h1>📚 单词管家</h1>
            <p>高效学习，轻松记忆</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" required>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required>
            </div>

            <button type="submit" class="btn-login">登 录</button>
        </form>

        <div id="message" class="message"></div>

        <div class="register-link">
            还没有账号？<a href="/register.html">立即注册</a>
        </div>
    </div>

    <script>
        // 创建气泡背景
        function createBubbles() {
            const bubblesContainer = document.getElementById('bubbles');
            const bubbleCount = 20;
            const colors = [
                'rgba(255, 255, 255, 0.1)',
                'rgba(100, 181, 246, 0.15)',
                'rgba(66, 165, 245, 0.12)',
                'rgba(41, 182, 246, 0.13)',
                'rgba(3, 169, 244, 0.14)',
                'rgba(144, 202, 249, 0.11)'
            ];

            for (let i = 0; i < bubbleCount; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                
                // 随机大小
                const size = Math.random() * 60 + 20;
                bubble.style.width = size + 'px';
                bubble.style.height = size + 'px';
                
                // 随机位置
                bubble.style.left = Math.random() * 100 + '%';
                
                // 随机颜色
                bubble.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                // 随机动画时长和延迟
                const duration = Math.random() * 10 + 8;
                const delay = Math.random() * 10;
                bubble.style.animationDuration = duration + 's';
                bubble.style.animationDelay = delay + 's';
                
                bubblesContainer.appendChild(bubble);
            }
        }

        // 眼睛跟随鼠标动画
        function initEyeTracking() {
            const eyes = document.querySelectorAll('.eye');
            
            document.addEventListener('mousemove', (e) => {
                eyes.forEach(eye => {
                    const pupil = eye.querySelector('.pupil');
                    const rect = eye.getBoundingClientRect();
                    const eyeCenterX = rect.left + rect.width / 2;
                    const eyeCenterY = rect.top + rect.height / 2;
                    
                    // 计算鼠标相对于眼睛中心的角度
                    const angle = Math.atan2(e.clientY - eyeCenterY, e.clientX - eyeCenterX);
                    
                    // 限制瞳孔移动范围（在眼睛内）
                    const distance = Math.min(
                        15,
                        Math.hypot(e.clientX - eyeCenterX, e.clientY - eyeCenterY) / 10
                    );
                    
                    const pupilX = Math.cos(angle) * distance;
                    const pupilY = Math.sin(angle) * distance;
                    
                    pupil.style.transform = `translate(calc(-50% + ${pupilX}px), calc(-50% + ${pupilY}px))`;
                });
            });
        }

        // 初始化
        window.addEventListener('load', () => {
            createBubbles();
            initEyeTracking();
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            try {
                // 调用后端登录接口
                const response = await fetch(`/api/login?username=${username}&password=${password}`);
                const result = await response.json();

                if (result.code === 200) {
                    // 登录成功
                    messageDiv.className = 'message success';
                    messageDiv.textContent = '登录成功！正在跳转...';
                    
                    // 保存用户信息到 localStorage
                    localStorage.setItem('currentUser', JSON.stringify(result.data));
                    
                    // 延迟跳转到主页
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 1500);
                } else {
                    // 登录失败
                    messageDiv.className = 'message error';
                    messageDiv.textContent = result.message || '登录失败，请重试';
                }
            } catch (error) {
                console.error('登录错误:', error);
                messageDiv.className = 'message error';
                messageDiv.textContent = '网络错误，请稍后重试';
            }
        });
    </script>
</body>
</html>
