<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词管家 - 登录</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus/dist/index.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            background: linear-gradient(135deg, #0f1b33 0%, #1a3a6b 30%, #2a5298 60%, #3a6ea5 80%, #5b8cb8 100%);
        }

        /* 动态粒子背景 */
        #particles-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        /* 气泡背景 */
        .bubbles {
            position: absolute;
            width: 100%; height: 100%;
            overflow: hidden;
            z-index: 1;
        }
        .bubble {
            position: absolute;
            bottom: -100px;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.15), rgba(102,126,234,0.08));
            border-radius: 50%;
            animation: float-up linear infinite;
            backdrop-filter: blur(1px);
        }
        @keyframes float-up {
            0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0; }
            5% { opacity: 0.6; }
            90% { opacity: 0.4; }
            100% { transform: translateY(-110vh) rotate(720deg) scale(0.5); opacity: 0; }
        }

        /* 主容器 */
        .login-wrapper {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 登录卡片 */
        .login-card {
            width: 440px;
            max-width: 100%;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 20px;
            padding: 40px 36px 32px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255,255,255,0.15);
            backdrop-filter: blur(20px);
            animation: card-enter 0.6s ease-out;
            border: 1px solid rgba(102,126,234,0.08);
        }
        @keyframes card-enter {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* 顶部图标 + 标题 */
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo-icon {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }
        .login-header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .login-header p {
            color: #909399;
            font-size: 14px;
            margin-top: 6px;
        }

        /* 眼睛动画 */
        .eyes-wrapper {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 24px;
        }
        .eye-outer {
            width: 56px; height: 56px;
            background: #f0f2f5;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.08);
        }
        .eye-inner {
            width: 44px; height: 44px;
            background: #fff;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .pupil {
            width: 20px; height: 20px;
            background: radial-gradient(circle at 40% 35%, #667eea, #3a4a8a);
            border-radius: 50%;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            transition: transform 0.08s ease-out;
        }
        .pupil::after {
            content: '';
            width: 8px; height: 8px;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
            position: absolute;
            top: 3px; right: 3px;
        }

        /* Element Plus 样式覆盖 */
        .login-form .el-form-item {
            margin-bottom: 22px;
        }
        .login-form .el-form-item__content {
            background: #f8f9fc;
            border-radius: 12px;
            padding: 2px;
            transition: background 0.25s;
        }
        .login-form .el-form-item__content:focus-within {
            background: #f0f2ff;
        }
        .login-form .el-input__wrapper {
            border-radius: 10px;
            padding: 4px 16px;
            box-shadow: 0 0 0 1px #e8ecf1 !important;
            background: transparent !important;
            transition: all 0.25s;
        }
        .login-form .el-input__wrapper.is-focus,
        .login-form .el-input__wrapper:hover {
            box-shadow: 0 0 0 2px rgba(102,126,234,0.35) !important;
            background: transparent !important;
        }
        .login-form .el-input__inner {
            height: 44px;
            font-size: 15px;
        }
        .login-form .el-input__prefix-inner {
            margin-right: 8px;
        }
        /* Select 样式 */
        .login-form .el-select {
            width: 100%;
        }
        .login-form .el-select .el-input__wrapper {
            background: transparent !important;
        }
        .login-form .el-select-dropdown {
            border-radius: 12px;
            border: 1px solid #e8ecf1;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            padding: 4px;
        }
        .login-form .el-select-dropdown .el-select-dropdown__item {
            border-radius: 8px;
            padding: 10px 16px;
            margin: 2px 0;
            font-size: 14px;
            min-height: 44px;
            height: auto;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }
        .login-form .el-select-dropdown .el-select-dropdown__item.hover {
            background: #f0f2ff !important;
        }
        .login-form .el-select-dropdown .el-select-dropdown__item.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            color: #fff !important;
            font-weight: 600;
        }
        .login-form .el-select-dropdown__wrap {
            max-height: 240px;
        }
        /* 按钮样式 */
        .login-form .el-button--primary {
            width: 100%;
            height: 46px;
            font-size: 16px;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            transition: all 0.3s;
            letter-spacing: 2px;
        }
        .login-form .el-button--primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102,126,234,0.45);
        }
        .login-form .el-button--primary:active {
            transform: translateY(0);
        }

        .login-form .el-divider__text {
            color: #c0c4cc;
            font-size: 12px;
        }

        .login-footer {
            text-align: center;
            margin-top: 18px;
        }
        .login-footer a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }
        .login-footer a:hover {
            color: #764ba2;
        }
        .login-footer .dot {
            color: #dcdfe6;
            margin: 0 12px;
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .login-card {
                padding: 28px 20px 24px;
                border-radius: 16px;
            }
            .login-header h1 { font-size: 24px; }
        }

        /* 消息提示 */
        .success-toast .el-message__content { color: #67c23a; }
        .error-toast .el-message__content { color: #f56c6c; }

        /* 自定义加载动画 */
        .loading-dots {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .loading-dots span {
            width: 6px; height: 6px;
            background: white;
            border-radius: 50%;
            animation: dot-bounce 1.4s ease-in-out infinite both;
        }
        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes dot-bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* 注册表单切换动画 */
        .form-enter { animation: form-slide 0.35s ease-out; }
        @keyframes form-slide {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>
    <canvas id="particles-canvas"></canvas>
    <div class="bubbles" id="bubbles"></div>

    <div class="login-wrapper">
        <div class="login-card" id="app">
            <div class="login-header">
                <span class="logo-icon">
                    <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
                        <rect width="52" height="52" rx="14" fill="url(#logo-grad)"/>
                        <text x="26" y="36" text-anchor="middle" font-size="28" fill="white" font-weight="bold">词</text>
                        <defs>
                            <linearGradient id="logo-grad" x1="0" y1="0" x2="52" y2="52">
                                <stop offset="0%" stop-color="#667eea"/>
                                <stop offset="100%" stop-color="#764ba2"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </span>
                <h1>单词管家</h1>
                <p>{{ isRegister ? '创建账号，开启高效学习之旅' : '高效学习，轻松记忆' }}</p>
            </div>

            <!-- 眼睛动画 -->
            <div class="eyes-wrapper">
                <div class="eye-outer">
                    <div class="eye-inner">
                        <div class="pupil" ref="leftPupil"></div>
                    </div>
                </div>
                <div class="eye-outer">
                    <div class="eye-inner">
                        <div class="pupil" ref="rightPupil"></div>
                    </div>
                </div>
            </div>

            <!-- 登录/注册表单切换 -->
            <el-form
                :model="form"
                :rules="rules"
                ref="formRef"
                class="login-form"
                label-position="top"
                size="large"
                @keyup.enter="handleSubmit"
            >
                <el-form-item prop="username">
                    <el-input
                        v-model="form.username"
                        :placeholder="isRegister ? '请设置用户名' : '请输入用户名'"
                        :prefix-icon="User"
                    />
                </el-form-item>

                <el-form-item prop="password">
                    <el-input
                        v-model="form.password"
                        type="password"
                        show-password
                        :placeholder="isRegister ? '请设置密码（至少6位）' : '请输入密码'"
                        :prefix-icon="Lock"
                    />
                </el-form-item>

                <el-form-item v-if="isRegister" prop="confirmPassword">
                    <el-input
                        v-model="form.confirmPassword"
                        type="password"
                        show-password
                        placeholder="请再次输入密码"
                        :prefix-icon="Lock"
                    />
                </el-form-item>

                <el-form-item v-if="isRegister" label="学习阶段" prop="phase">
                    <el-select v-model="form.phase" placeholder="选择你的学习阶段" style="width: 100%">
                        <el-option label="小学" value="primary">
                            <span style="float:left">小学</span>
                            <span style="float:right;color:#909399;font-size:12px;">Primary</span>
                        </el-option>
                        <el-option label="初中" value="junior">
                            <span style="float:left">初中</span>
                            <span style="float:right;color:#909399;font-size:12px;">Junior</span>
                        </el-option>
                        <el-option label="高中" value="senior">
                            <span style="float:left">高中</span>
                            <span style="float:right;color:#909399;font-size:12px;">Senior</span>
                        </el-option>
                        <el-option label="非学生" value="non-student">
                            <span style="float:left">非学生</span>
                            <span style="float:right;color:#909399;font-size:12px;">Non-student</span>
                        </el-option>
                    </el-select>
                </el-form-item>

                <el-form-item v-if="isRegister" label="学习类型" prop="userType">
                    <el-select v-model="form.userType" placeholder="选择适合你的学习方式" style="width: 100%">
                        <el-option label="刷题型" value="quiz">
                            <div style="display:flex;align-items:baseline;gap:6px;">
                                <span style="font-weight:500;white-space:nowrap;">刷题型</span>
                                <span style="font-size:12px;color:#909399;">偏好快速检验、大量刷词的学习方式</span>
                            </div>
                        </el-option>
                        <el-option label="记忆型" value="memory">
                            <div style="display:flex;align-items:baseline;gap:6px;">
                                <span style="font-weight:500;white-space:nowrap;">记忆型</span>
                                <span style="font-size:12px;color:#909399;">偏好深度加工、反复记忆的学习方式</span>
                            </div>
                        </el-option>
                    </el-select>
                </el-form-item>

                <el-form-item style="margin-bottom: 12px;">
                    <el-button
                        type="primary"
                        :loading="loading"
                        @click="handleSubmit"
                        round
                    >
                        <span v-if="loading">
                            <span class="loading-dots"><span></span><span></span><span></span></span>
                        </span>
                        <span v-else>{{ isRegister ? '注  册' : '登  录' }}</span>
                    </el-button>
                </el-form-item>
            </el-form>

            <div class="login-footer">
                <template v-if="isRegister">
                    <span style="color: #909399;">已有账号？</span>
                    <a href="javascript:void(0)" @click="toggleMode">立即登录</a>
                </template>
                <template v-else>
                    <span style="color: #909399;">还没有账号？</span>
                    <a href="javascript:void(0)" @click="toggleMode">立即注册</a>
                </template>
            </div>
        </div>
    </div>

    <!-- Vue & Element Plus & axios -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/element-plus">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue"></script>

    <script>
        const { createApp, ref, reactive, computed, nextTick, onMounted, onBeforeUnmount } = Vue;

        const app = createApp({
            setup() {
                const isRegister = ref(false);
                const loading = ref(false);
                const formRef = ref(null);
                const leftPupil = ref(null);
                const rightPupil = ref(null);

                const form = reactive({
                    username: '',
                    password: '',
                    confirmPassword: '',
                    phase: '',
                    userType: ''
                });

                // 验证确认密码
                const validateConfirm = (rule, value, callback) => {
                    if (isRegister.value && value !== form.password) {
                        callback(new Error('两次输入的密码不一致'));
                    } else {
                        callback();
                    }
                };

                const rules = computed(() => {
                    const pwdRules = [
                        { required: true, message: '请输入密码', trigger: 'blur' }
                    ];
                    if (isRegister.value) {
                        pwdRules.push({ min: 6, message: '密码至少 6 位', trigger: 'blur' });
                    }
                    return {
                        username: [
                            { required: true, message: '请输入用户名', trigger: 'blur' },
                            { min: 2, max: 20, message: '用户名长度 2-20 个字符', trigger: 'blur' }
                        ],
                        password: pwdRules,
                        confirmPassword: [
                            { required: isRegister.value, message: '请再次输入密码', trigger: 'blur' },
                            { validator: validateConfirm, trigger: 'blur' }
                        ],
                        phase: [
                            { required: isRegister.value, message: '请选择学习阶段', trigger: 'change' }
                        ],
                        userType: [
                            { required: isRegister.value, message: '请选择学习类型', trigger: 'change' }
                        ]
                    };
                });

                const toggleMode = () => {
                    isRegister.value = !isRegister.value;
                    form.confirmPassword = '';
                    form.phase = '';
                    form.userType = '';
                    formRef.value?.clearValidate();
                };

                const handleSubmit = async () => {
                    if (!formRef.value) return;
                    try {
                        await formRef.value.validate();
                    } catch {
                        return;
                    }

                    loading.value = true;

                    try {
                        if (isRegister.value) {
                            // 注册
                            const res = await axios.get('/api/register', {
                                params: {
                                    username: form.username,
                                    password: form.password,
                                    phase: form.phase,
                                    userType: form.userType
                                }
                            });
                            if (res.data.code === 200) {
                                ElementPlus.ElMessage.success('注册成功！正在自动登录...');
                                // 注册成功后自动登录
                                const loginRes = await axios.get('/api/login', {
                                    params: { username: form.username, password: form.password }
                                });
                                if (loginRes.data.code === 200) {
                                    localStorage.setItem('currentUser', JSON.stringify(loginRes.data.data));
                                    setTimeout(() => {
                                        window.location.href = '/dashboard.html';
                                    }, 1500);
                                } else {
                                    // 自动登录失败，切回登录表单
                                    setTimeout(() => {
                                        isRegister.value = false;
                                        form.password = '';
                                        form.confirmPassword = '';
                                    }, 2000);
                                }
                            } else {
                                ElementPlus.ElMessage.error(res.data.message || '注册失败');
                            }
                        } else {
                            // 登录
                            const res = await axios.get('/api/login', {
                                params: {
                                    username: form.username,
                                    password: form.password
                                }
                            });
                            if (res.data.code === 200) {
                                localStorage.setItem('currentUser', JSON.stringify(res.data.data));
                                ElementPlus.ElMessage.success('登录成功！正在跳转...');
                                setTimeout(() => {
                                    window.location.href = '/dashboard.html';
                                }, 1000);
                            } else {
                                ElementPlus.ElMessage.error(res.data.message || '用户名或密码错误');
                            }
                        }
                    } catch (err) {
                        console.error('请求失败:', err);
                        ElementPlus.ElMessage.error('网络错误，请稍后重试');
                    } finally {
                        loading.value = false;
                    }
                };

                // ============ 眼睛跟踪 ============
                const handleMouseMove = (e) => {
                    const pupils = [leftPupil.value, rightPupil.value];
                    if (!pupils[0] || !pupils[1]) return;

                    document.querySelectorAll('.eye-inner').forEach((eye, idx) => {
                        const rect = eye.getBoundingClientRect();
                        const cx = rect.left + rect.width / 2;
                        const cy = rect.top + rect.height / 2;
                        const angle = Math.atan2(e.clientY - cy, e.clientX - cx);
                        const dist = Math.min(14, Math.hypot(e.clientX - cx, e.clientY - cy) / 12);
                        const px = Math.cos(angle) * dist;
                        const py = Math.sin(angle) * dist;
                        pupils[idx].style.transform = `translate(calc(-50% + ${px}px), calc(-50% + ${py}px))`;
                    });
                };

                // ============ 粒子背景 ============
                let particlesAnimId = null;
                const initParticles = () => {
                    const canvas = document.getElementById('particles-canvas');
                    const ctx = canvas.getContext('2d');
                    let w, h;

                    const resize = () => {
                        w = canvas.width = window.innerWidth;
                        h = canvas.height = window.innerHeight;
                    };
                    resize();
                    window.addEventListener('resize', resize);

                    const count = 60;
                    const particles = Array.from({ length: count }, () => ({
                        x: Math.random() * w,
                        y: Math.random() * h,
                        r: Math.random() * 2 + 1,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: (Math.random() - 0.5) * 0.5,
                        a: Math.random() * 0.4 + 0.1
                    }));

                    const draw = () => {
                        ctx.clearRect(0, 0, w, h);
                        particles.forEach(p => {
                            p.x += p.vx;
                            p.y += p.vy;
                            if (p.x < 0) p.x = w;
                            if (p.x > w) p.x = 0;
                            if (p.y < 0) p.y = h;
                            if (p.y > h) p.y = 0;

                            ctx.beginPath();
                            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                            ctx.fillStyle = `rgba(255, 255, 255, ${p.a})`;
                            ctx.fill();
                        });

                        // 连线
                        for (let i = 0; i < particles.length; i++) {
                            for (let j = i + 1; j < particles.length; j++) {
                                const dx = particles[i].x - particles[j].x;
                                const dy = particles[i].y - particles[j].y;
                                const dist = Math.hypot(dx, dy);
                                if (dist < 120) {
                                    ctx.beginPath();
                                    ctx.moveTo(particles[i].x, particles[i].y);
                                    ctx.lineTo(particles[j].x, particles[j].y);
                                    ctx.strokeStyle = `rgba(255, 255, 255, ${0.08 * (1 - dist / 120)})`;
                                    ctx.stroke();
                                }
                            }
                        }

                        particlesAnimId = requestAnimationFrame(draw);
                    };
                    draw();

                    return () => {
                        cancelAnimationFrame(particlesAnimId);
                        window.removeEventListener('resize', resize);
                    };
                };

                // ============ 气泡 ============
                const initBubbles = () => {
                    const container = document.getElementById('bubbles');
                    for (let i = 0; i < 16; i++) {
                        const b = document.createElement('div');
                        b.className = 'bubble';
                        const size = Math.random() * 80 + 30;
                        b.style.width = size + 'px';
                        b.style.height = size + 'px';
                        b.style.left = Math.random() * 100 + '%';
                        b.style.animationDuration = (Math.random() * 12 + 10) + 's';
                        b.style.animationDelay = (Math.random() * 12) + 's';
                        container.appendChild(b);
                    }
                };

                onMounted(() => {
                    document.addEventListener('mousemove', handleMouseMove);
                    const stopParticles = initParticles();
                    initBubbles();
                    onBeforeUnmount(() => {
                        document.removeEventListener('mousemove', handleMouseMove);
                        stopParticles();
                    });
                });

                // 图标引用
                const User = ElementPlusIconsVue.User;
                const Lock = ElementPlusIconsVue.Lock;

                return {
                    isRegister, loading, formRef, form, rules,
                    leftPupil, rightPupil,
                    toggleMode, handleSubmit,
                    User, Lock
                };
            }
        });

        // 注册 Element Plus 图标
        for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
            app.component(key, component);
        }
        app.use(ElementPlus);
        app.mount('#app');
    </script>
</body>
</html>
