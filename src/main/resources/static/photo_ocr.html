<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>照片识词 - 单词管家</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 1000px; margin: 20px auto; }

        .header {
            background: white;
            padding: 18px 28px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }
        .header h1 { color: #667eea; font-size: 22px; }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .back-btn {
            background: #667eea;
            color: white;
            padding: 8px 18px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            transition: background 0.3s;
        }
        .back-btn:hover { background: #5a6fd6; }
        .model-status {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
        }
        .model-status.ok { background: #e8f5e9; color: #2e7d32; }
        .model-status.loading { background: #fff3e0; color: #e65100; }
        .model-status.error { background: #ffebee; color: #c62828; }

        .main-card {
            background: white;
            border-radius: 16px;
            margin-top: 22px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .card-banner {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 28px 32px;
            color: white;
        }
        .card-banner h2 { font-size: 20px; margin-bottom: 6px; }
        .card-banner p { font-size: 14px; opacity: 0.85; }

        .card-body { padding: 28px 32px; }

        .upload-zone {
            display: flex;
            gap: 28px;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .preview-area {
            width: 380px;
            height: 280px;
            border-radius: 12px;
            border: 2px dashed #d0d5e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f8f9fc;
            overflow: hidden;
            position: relative;
            transition: border-color 0.3s, background 0.3s;
            cursor: pointer;
        }
        .preview-area:hover { border-color: #667eea; background: #f0f2ff; }
        .preview-area.dragover { border-color: #667eea; background: #eef0ff; }
        .preview-area img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 8px;
        }
        .preview-placeholder {
            text-align: center;
            color: #aaa;
        }
        .preview-placeholder .icon { font-size: 48px; margin-bottom: 10px; }
        .preview-placeholder p { font-size: 14px; }
        .preview-placeholder .hint { font-size: 12px; color: #ccc; margin-top: 6px; }

        .action-panel { flex: 1; min-width: 280px; }

        .file-input-wrapper {
            position: relative;
            margin-bottom: 16px;
        }
        .file-input-wrapper input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            top: 0; left: 0;
        }
        .file-label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 18px;
            border: 2px dashed #d0d5e0;
            border-radius: 10px;
            color: #666;
            font-size: 14px;
            background: #fafbfd;
            transition: border-color 0.3s;
        }
        .file-label:hover { border-color: #667eea; color: #667eea; }
        .file-label .file-icon { font-size: 22px; }

        .btn-group { display: flex; gap: 10px; margin-bottom: 18px; }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-outline {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }
        .btn-outline:hover { background: #f0f2ff; }
        .btn-success {
            background: #67c23a;
            color: white;
        }
        .btn-success:hover { background: #5daf34; }
        .btn-success:disabled { opacity: 0.5; cursor: not-allowed; }

        .candidate-card {
            padding: 14px 18px;
            border: 2px solid #e8e8e8;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.25s;
            background: #fafbfd;
        }
        .candidate-card:hover { border-color: #667eea; background: #f5f7ff; }
        .candidate-card.selected { border-color: #667eea; background: #f0f2ff; }
        .candidate-card .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
            background: transparent;
            box-shadow: none;
            padding: 0;
            border-radius: 0;
        }
        .candidate-card .header .name {
            font-size: 16px;
            font-weight: 600;
            color: #303133;
        }
        .candidate-card .header .confidence {
            font-size: 12px;
            color: #999;
        }
        .confidence-bar {
            height: 6px;
            border-radius: 3px;
            background: #e8e8e8;
            margin-bottom: 6px;
            overflow: hidden;
        }
        .confidence-bar .fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s;
        }
        .tag {
            display: inline-block;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 6px;
        }
        .tag-success { background: #e8f5e9; color: #2e7d32; }
        .tag-warning { background: #fff3e0; color: #e65100; }

        .file-name {
            font-size: 13px;
            color: #888;
            margin-bottom: 12px;
            word-break: break-all;
        }
        .file-name span { color: #667eea; font-weight: 600; }

        .edit-input {
            width: 100%;
            margin-top: 8px;
            padding: 8px 12px;
            border: 1px solid #d0d5e0;
            border-radius: 6px;
            font-size: 13px;
        }
        .edit-input:focus { outline: none; border-color: #667eea; }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        .tip-bar {
            margin-top: 20px;
            padding: 14px 18px;
            background: #f5f0ff;
            border-radius: 10px;
            border-left: 4px solid #764ba2;
            color: #666;
            font-size: 13px;
            line-height: 1.7;
        }
        .tip-bar code {
            background: #ede7f6;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .alert-info { background: #e3f2fd; color: #1565c0; border-left: 4px solid #1976d2; }
        .alert-success { background: #e8f5e9; color: #2e7d32; border-left: 4px solid #43a047; }
        .alert-error { background: #ffebee; color: #c62828; border-left: 4px solid #e53935; }

        @media (max-width: 768px) {
            .upload-zone { flex-direction: column; }
            .preview-area { width: 100%; height: 220px; }
            .action-panel { min-width: auto; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📷 照片识词</h1>
        <div class="header-right">
            <span class="model-status" id="modelStatus">检查中…</span>
            <a href="/dashboard.html" class="back-btn">← 返回首页</a>
        </div>
    </div>

    <div id="modelAlert"></div>

    <div class="main-card">
        <div class="card-banner">
            <h2>📸 拍照识别单词</h2>
            <p>上传或拍摄照片，自动识别画面中的物体并推荐对应英文单词，一键加入你的词汇库</p>
        </div>

        <div class="card-body">
            <div class="upload-zone">
                <div class="preview-area" id="imgPreview">
                    <div class="preview-placeholder" id="placeholder">
                        <div class="icon">🖼️</div>
                        <p>点击或拖拽图片到此处</p>
                        <div class="hint">支持 jpg / png 格式</div>
                    </div>
                </div>

                <div class="action-panel">
                    <div class="file-input-wrapper">
                        <div class="file-label">
                            <span class="file-icon">📁</span>
                            <span id="fileText">选择图片文件…</span>
                        </div>
                        <input type="file" id="fileInput" accept="image/*">
                    </div>

                    <div class="file-name" id="fileName" style="display:none">
                        已选择：<span id="fileNameText"></span>
                    </div>

                    <div class="btn-group">
                        <button class="btn btn-primary" id="recognizeBtn" disabled>🔍 开始识别</button>
                        <button class="btn btn-outline" id="clearBtn">🗑️ 清除</button>
                    </div>

                    <!-- 识别结果候选区 -->
                    <div id="candidatesArea" style="display:none; margin-bottom: 16px;"></div>

                    <!-- 加入词库按钮 -->
                    <div id="addWordSection" style="display:none;">
                        <button class="btn btn-success" id="addWordBtn" disabled>✅ 加入词库</button>
                    </div>

                    <!-- 手动输入（模型不可用时） -->
                    <div id="manualSection" style="display:none; margin-bottom: 16px;">
                        <label style="display:block; font-size:14px; font-weight:600; color:#444; margin-bottom:8px;">✏️ 手动输入单词</label>
                        <input type="text" id="manualWord" class="edit-input" placeholder="输入英文单词" />
                        <input type="text" id="manualTranslation" class="edit-input" style="margin-top:6px;" placeholder="输入中文释义（可选）" />
                        <button class="btn btn-success" id="manualAddBtn" style="margin-top:8px;">📚 添加到词库</button>
                    </div>
                </div>
            </div>

            <div class="tip-bar" id="tipBar">
                💡 <strong>提示：</strong>上传照片后点击「开始识别」，系统将自动识别物体并推荐对应英文单词。识别结果会在上方展示，点击候选词卡片可选中，点击「加入词库」一键添加。
            </div>
        </div>
    </div>
</div>

<script>
    // ========== DOM 引用 ==========
    const fileInput = document.getElementById('fileInput');
    const imgPreview = document.getElementById('imgPreview');
    const placeholder = document.getElementById('placeholder');
    const recognizeBtn = document.getElementById('recognizeBtn');
    const clearBtn = document.getElementById('clearBtn');
    const fileNameDiv = document.getElementById('fileName');
    const fileNameText = document.getElementById('fileNameText');
    const fileText = document.getElementById('fileText');
    const candidatesArea = document.getElementById('candidatesArea');
    const addWordSection = document.getElementById('addWordSection');
    const addWordBtn = document.getElementById('addWordBtn');
    const manualSection = document.getElementById('manualSection');
    const manualWord = document.getElementById('manualWord');
    const manualTranslation = document.getElementById('manualTranslation');
    const manualAddBtn = document.getElementById('manualAddBtn');
    const modelStatusEl = document.getElementById('modelStatus');
    const modelAlert = document.getElementById('modelAlert');
    const tipBar = document.getElementById('tipBar');

    // ========== 状态 ==========
    let currentFile = null;
    let ocrCandidates = [];
    let selectedIndex = null;
    let modelReady = false;
    let modelError = '';
    let modelChecked = false;

    // ========== 事件绑定 ==========

    // 拖拽上传
    imgPreview.addEventListener('dragover', (e) => {
        e.preventDefault();
        imgPreview.classList.add('dragover');
    });
    imgPreview.addEventListener('dragleave', () => {
        imgPreview.classList.remove('dragover');
    });
    imgPreview.addEventListener('drop', (e) => {
        e.preventDefault();
        imgPreview.classList.remove('dragover');
        const f = e.dataTransfer.files[0];
        if (f && f.type.startsWith('image/')) {
            handleFile(f);
        }
    });
    // 点击预览区触发文件选择
    imgPreview.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
        const f = e.target.files[0];
        if (f) handleFile(f);
    });

    recognizeBtn.addEventListener('click', startRecognition);
    clearBtn.addEventListener('click', clearAll);
    addWordBtn.addEventListener('click', addWordToLibrary);
    manualAddBtn.addEventListener('click', addManualWord);

    // ========== 模型状态检查 ==========
    async function checkModelStatus() {
        try {
            const res = await fetch('/api/ocr/status');
            const data = await res.json();
            modelChecked = true;
            if (data.code === 200 && data.data) {
                if (data.data.modelReady) {
                    modelReady = true;
                    modelStatusEl.textContent = '模型就绪';
                    modelStatusEl.className = 'model-status ok';
                    modelAlert.innerHTML = '';
                } else if (data.data.modelError) {
                    modelReady = false;
                    modelError = data.data.modelError;
                    modelStatusEl.textContent = '模型异常';
                    modelStatusEl.className = 'model-status error';
                    modelAlert.innerHTML = '<div class="alert alert-error">⚠️ ' + data.data.modelError + '</div>';
                    manualSection.style.display = 'block';
                    tipBar.innerHTML = '💡 <strong>提示：</strong>模型不可用，您可以手动输入单词添加到词库。';
                } else {
                    modelReady = false;
                    modelStatusEl.textContent = '加载中…';
                    modelStatusEl.className = 'model-status loading';
                    modelAlert.innerHTML = '<div class="alert alert-info">⏳ 图像识别模型正在加载，首次加载需下载模型文件（约 100MB），请耐心等待…</div>';
                }
            }
        } catch (e) {
            modelChecked = true;
            modelReady = false;
            modelError = '无法连接识别服务';
            modelStatusEl.textContent = '服务异常';
            modelStatusEl.className = 'model-status error';
            modelAlert.innerHTML = '<div class="alert alert-error">⚠️ 无法连接识别服务，请检查后端是否启动</div>';
        }
    }

    // 页面加载时检查
    checkModelStatus();

    // ========== 文件处理 ==========
    function handleFile(f) {
        currentFile = f;
        const url = URL.createObjectURL(f);
        imgPreview.innerHTML = '';
        const img = document.createElement('img');
        img.src = url;
        imgPreview.appendChild(img);
        recognizeBtn.disabled = false;
        fileNameDiv.style.display = 'block';
        fileNameText.textContent = f.name;
        fileText.textContent = f.name;
        // 清除之前的结果
        clearResults();
    }

    // ========== 识别 ==========
    async function startRecognition() {
        if (!currentFile) return;

        recognizeBtn.disabled = true;
        recognizeBtn.innerHTML = '<span class="loading-spinner"></span>识别中…';
        clearResults();

        try {
            const formData = new FormData();
            formData.append('file', currentFile);

            // 从 URL 参数或 localStorage 获取 userId
            const params = new URLSearchParams(window.location.search);
            const userId = params.get('userId') || localStorage.getItem('ocrUserId');
            if (userId) {
                formData.append('userId', userId);
            }

            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 30000);

            const res = await fetch('/api/ocr/recognize', {
                method: 'POST',
                body: formData,
                signal: controller.signal
            });
            clearTimeout(timeout);

            const data = await res.json();

            if (data.code === 200 && data.data && data.data.length > 0) {
                ocrCandidates = data.data;
                renderCandidates();
                addWordSection.style.display = 'block';
                candidatesArea.style.display = 'block';
                if (data.data.length > 0) {
                    selectCandidate(0);
                }
            } else if (data.code === 200) {
                candidatesArea.innerHTML = '<div class="alert alert-info">未识别到物体，请换一张照片试试</div>';
                candidatesArea.style.display = 'block';
            } else {
                alert('识别失败：' + (data.message || '未知错误'));
            }
        } catch (e) {
            if (e.name === 'AbortError') {
                alert('识别超时，请检查模型是否已加载');
            } else {
                console.error('Recognition error:', e);
                try {
                    const errData = await e.response?.json?.();
                    alert('识别失败：' + (errData?.message || '网络错误'));
                } catch (_) {
                    alert('识别请求失败，请检查服务是否正常运行');
                }
            }
        } finally {
            recognizeBtn.innerHTML = '🔍 开始识别';
            recognizeBtn.disabled = false;
        }
    }

    // ========== 候选词渲染 ==========
    function renderCandidates() {
        candidatesArea.innerHTML = '';
        ocrCandidates.forEach((cand, idx) => {
            const card = document.createElement('div');
            card.className = 'candidate-card';
            card.dataset.index = idx;
            card.onclick = () => selectCandidate(idx);

            const pct = Math.round(cand.confidence * 100);
            const barColor = cand.confidence > 0.7 ? '#67c23a' : cand.confidence > 0.4 ? '#e6a23c' : '#f56c6c';
            const tagHtml = cand.matched
                ? '<span class="tag tag-success">✅ 已收录</span>'
                : '<span class="tag tag-warning">🆕 新词</span>';

            let detailHtml = '';
            if (cand.matched) {
                detailHtml = '<div style="font-size:13px; color:#666; line-height:1.6; margin-top:4px;">';
                if (cand.translation) detailHtml += '📖 ' + cand.translation + ' ';
                if (cand.phonetic) detailHtml += '🔊 ' + cand.phonetic;
                if (cand.partOfSpeech) detailHtml += '<span style="color:#999; margin-left:8px;">' + cand.partOfSpeech + '</span>';
                detailHtml += '</div>';
            } else {
                detailHtml = '<div class="edit-area" data-index="' + idx + '" style="display:none; margin-top:8px;">' +
                    '<input type="text" class="edit-input word-input" placeholder="编辑单词..." value="' + escHtml(cand.displayName || '') + '" />' +
                    '<input type="text" class="edit-input trans-input" style="margin-top:6px;" placeholder="输入中文释义（可选）" />' +
                    '</div>';
            }

            card.innerHTML = '<div class="header">' +
                '<div><span class="name">' + escHtml(cand.displayName || cand.label) + '</span>' + tagHtml + '</div>' +
                '<span class="confidence">' + pct + '%</span>' +
                '</div>' +
                '<div class="confidence-bar"><div class="fill" style="width:' + pct + '%; background:' + barColor + ';"></div></div>' +
                detailHtml;

            candidatesArea.appendChild(card);
        });

        if (selectedIndex !== null) {
            const cards = candidatesArea.querySelectorAll('.candidate-card');
            if (cards[selectedIndex]) cards[selectedIndex].classList.add('selected');
        }
    }

    function selectCandidate(idx) {
        selectedIndex = idx;
        // 更新选中状态
        const cards = candidatesArea.querySelectorAll('.candidate-card');
        cards.forEach((c, i) => c.classList.toggle('selected', i === idx));

        // 显示编辑区域
        cards.forEach((c, i) => {
            const editArea = c.querySelector('.edit-area');
            if (editArea) {
                editArea.style.display = (i === idx) ? 'block' : 'none';
            }
        });

        // 启用加入词库按钮
        addWordBtn.disabled = false;
    }

    // ========== 加入词库 ==========
    async function addWordToLibrary() {
        if (selectedIndex === null || !ocrCandidates[selectedIndex]) return;

        const candidate = ocrCandidates[selectedIndex];

        // 从 URL 参数或 localStorage 获取 userId
        const params = new URLSearchParams(window.location.search);
        let userId = params.get('userId') || localStorage.getItem('ocrUserId');
        if (!userId) {
            userId = prompt('请输入您的用户 ID（在个人中心查看）：');
            if (!userId) return;
            localStorage.setItem('ocrUserId', userId);
        }

        addWordBtn.disabled = true;
        addWordBtn.innerHTML = '<span class="loading-spinner"></span>添加中…';

        try {
            // 如果已匹配到现有单词，不需要添加
            if (candidate.matched) {
                alert('✅ 该单词已在词库中');
                resetAfterAdd();
                return;
            }

            // 获取编辑框中的值
            const card = candidatesArea.querySelectorAll('.candidate-card')[selectedIndex];
            const wordInput = card?.querySelector('.word-input');
            const transInput = card?.querySelector('.trans-input');
            const word = wordInput?.value?.trim() || candidate.displayName || candidate.label || '';
            const translation = transInput?.value?.trim() || '';

            if (!word) {
                alert('请输入单词');
                addWordBtn.disabled = false;
                addWordBtn.innerHTML = '✅ 加入词库';
                return;
            }

            const res = await fetch('/api/ocr/add-word', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    word: word.toLowerCase(),
                    translation: translation,
                    userId: userId
                })
            });

            const data = await res.json();

            if (data.code === 200) {
                alert('✅ "' + word + '" 已添加到词库');
                resetAfterAdd();
            } else {
                alert('添加失败：' + (data.message || '未知错误'));
            }
        } catch (e) {
            console.error('Add word error:', e);
            alert('添加失败，请检查网络连接');
        } finally {
            addWordBtn.innerHTML = '✅ 加入词库';
        }
    }

    async function addManualWord() {
        const word = manualWord.value?.trim();
        if (!word) {
            alert('请输入要添加的单词');
            return;
        }

        const params = new URLSearchParams(window.location.search);
        let userId = params.get('userId') || localStorage.getItem('ocrUserId');
        if (!userId) {
            userId = prompt('请输入您的用户 ID（在个人中心查看）：');
            if (!userId) return;
            localStorage.setItem('ocrUserId', userId);
        }

        const translation = manualTranslation.value?.trim() || '';

        try {
            manualAddBtn.disabled = true;
            manualAddBtn.innerHTML = '<span class="loading-spinner"></span>添加中…';

            const res = await fetch('/api/ocr/add-word', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    word: word.toLowerCase(),
                    translation: translation,
                    userId: userId
                })
            });

            const data = await res.json();

            if (data.code === 200) {
                alert('✅ "' + word + '" 已添加到词库');
                manualWord.value = '';
                manualTranslation.value = '';
            } else {
                alert('添加失败：' + (data.message || '未知错误'));
            }
        } catch (e) {
            alert('添加失败，请检查网络连接');
        } finally {
            manualAddBtn.disabled = false;
            manualAddBtn.innerHTML = '📚 添加到词库';
        }
    }

    // ========== 工具 ==========
    function resetAfterAdd() {
        ocrCandidates = [];
        selectedIndex = null;
        addWordSection.style.display = 'none';
        candidatesArea.style.display = 'none';
        addWordBtn.disabled = true;
    }

    function clearResults() {
        ocrCandidates = [];
        selectedIndex = null;
        candidatesArea.innerHTML = '';
        candidatesArea.style.display = 'none';
        addWordSection.style.display = 'none';
        addWordBtn.disabled = true;
    }

    function clearAll() {
        fileInput.value = null;
        currentFile = null;
        imgPreview.innerHTML = '';
        imgPreview.appendChild(placeholder);
        recognizeBtn.disabled = true;
        recognizeBtn.innerHTML = '🔍 开始识别';
        clearResults();
        fileNameDiv.style.display = 'none';
        fileText.textContent = '选择图片文件…';
    }

    function escHtml(s) {
        if (!s) return '';
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
</script>
</body>
</html>
