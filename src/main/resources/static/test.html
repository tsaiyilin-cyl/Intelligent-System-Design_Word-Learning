<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词测试 - 单词管家</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 20px auto; }
        .header { background: white; padding: 18px 24px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 8px 30px rgba(0,0,0,0.12); margin-bottom: 20px; }
        .header h1 { color: #667eea; }
        .back-btn { background: #667eea; color: #fff; padding: 8px 14px; border-radius: 8px; text-decoration: none; }
        .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
        .setup-group { margin-bottom: 20px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
        .setup-group label { font-weight: bold; }
        select, input { padding: 8px 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; }
        .question-area { margin: 20px 0; }
        .question-text { font-size: 28px; font-weight: bold; margin-bottom: 20px; text-align: center; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
        .opt { padding: 12px; background: #f7f7f7;border: 2px solid transparent; border-radius: 8px; cursor: pointer; text-align: center; transition: background 0.2s; }
        .opt:hover { background: #eef3ff; }
        .opt.selected { background: #d9e6ff; border: 2px solid #667eea; }
        .spelling-input { width: 100%; padding: 12px; font-size: 18px; border: 2px solid #e0e0e0; border-radius: 8px; margin: 20px 0; }
        .controls { display: flex; gap: 12px; justify-content: center; margin-top: 20px; }
        .btn { padding: 10px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
        .btn-secondary { background: #f0f0f0; color: #666; }
        .result-area { margin-top: 20px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📝 单词测试</h1>
        <a href="dashboard.html" class="back-btn">← 返回首页</a>
    </div>
    <div class="card">
        <div id="setupPanel">
            <div class="setup-group">
                <label>题型选择：</label>
                <select id="questionType">
                    <option value="en2zh">英译中（选择题）</option>
                    <option value="zh2en">中译英（选择题）</option>
                    <option value="spelling">拼写填空</option>
                </select>
            </div>
            <div class="setup-group">
                <label>题目数量：</label>
                <input type="number" id="questionCount" value="10" min="1" max="30">
            </div>
            <div style="text-align: center;">
                <button id="startBtn" class="btn btn-primary">开始测试</button>
            </div>
        </div>
        <div id="testPanel" style="display: none;">
            <div class="question-area">
                <div id="questionDisplay"></div>
                <div id="optionsArea"></div>
            </div>
            <div class="controls">
                <button id="submitBtn" class="btn btn-primary">确定</button>
                <button id="finishBtn" class="btn btn-secondary">结束测试</button>
            </div>
        </div>
        <div id="resultArea" class="result-area"></div>
    </div>
</div>

<script>
    let currentUser = null;
    let questions = [];
    let currentIndex = 0;
    let correctCount = 0;
    let currentAnswer = null;
    let testActive = false;
    let currentSessionId = null;  // 保存当前测试会话ID
    let answerRecords = [];       // 保存所有答题记录

    function getCurrentUser() {
        const userStr = localStorage.getItem('currentUser');
        if (!userStr) {
            alert('请先登录');
            window.location.href = '/login.html';
            return null;
        }
        return JSON.parse(userStr);
    }
    let testStartTime = null;   // 在开始测试时记录
    let currentQuestionType = null; // 记录当前测试题型

    // 修改 startTest 函数，记录开始时间和题型
    async function startTest() {
        const count = parseInt(document.getElementById('questionCount').value);
        const questionType = document.getElementById('questionType').value;
        if (isNaN(count) || count < 1) return;
        currentUser = getCurrentUser();
        if (!currentUser) return;

        // 记录开始时间
        testStartTime = Date.now();
        currentQuestionType = questionType;

        try {
            const response = await fetch('/api/test/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: currentUser.userId,
                    count: count,
                    questionType: questionType
                })
            });
            const result = await response.json();
            if (result.code === 200 && result.data) {
                // 新数据结构：{sessionId: "...", questions: [...]}
                currentSessionId = result.data.sessionId;
                questions = result.data.questions;
                currentIndex = 0;
                correctCount = 0;
                answerRecords = [];  // 清空答题记录
                testActive = true;
                document.getElementById('setupPanel').style.display = 'none';
                document.getElementById('testPanel').style.display = 'block';
                document.getElementById('resultArea').innerHTML = '';
                renderCurrentQuestion();
            } else {
                alert('生成题目失败：' + (result.message || '未知错误'));
            }
        } catch (err) {
            console.error(err);
            alert('网络错误');
        }
    }

    function renderCurrentQuestion() {
        const q = questions[currentIndex];
        const displayDiv = document.getElementById('questionDisplay');
        const optionsDiv = document.getElementById('optionsArea');
        currentAnswer = null;

        if (q.type === 'en2zh_choice') {
            displayDiv.innerHTML = `<div class="question-text">📖 ${q.content}</div>`;
            renderOptions(q.options);
        } else if (q.type === 'zh2en_choice') {
            displayDiv.innerHTML = `<div class="question-text">🇨🇳 ${q.content}</div>`;
            renderOptions(q.options);
        } else if (q.type === 'spelling') {
            const wordLen = q.correctAnswer.length;
            const firstLetter = q.correctAnswer.charAt(0).toUpperCase();
            const placeholderHint = firstLetter + '_'.repeat(wordLen - 1);
            displayDiv.innerHTML = `
                <div style="margin-bottom: 10px; font-size: 18px; color: #666;">【${q.partOfSpeech || ''}】</div>
                <div class="question-text" style="font-size: 20px;">📖 ${q.translation || ''}</div>
            `;
            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = placeholderHint;
            input.className = 'spelling-input';
            input.id = 'spellingInput';
            optionsDiv.innerHTML = '';
            optionsDiv.appendChild(input);
            input.addEventListener('input', (e) => { currentAnswer = e.target.value.trim(); });
        }
    }

    function renderOptions(opts) {
        const optionsDiv = document.getElementById('optionsArea');
        optionsDiv.innerHTML = '';
        const container = document.createElement('div');
        container.className = 'options';
        opts.forEach(opt => {
            const optDiv = document.createElement('div');
            optDiv.className = 'opt';
            optDiv.textContent = opt;
            optDiv.onclick = () => {
                document.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
                optDiv.classList.add('selected');
                currentAnswer = opt;
            };
            container.appendChild(optDiv);
        });
        optionsDiv.appendChild(container);
    }

    async function submitAnswer() {
        if (!testActive) return;
        const q = questions[currentIndex];
        let userAnswer = currentAnswer;
        if (q.type === 'spelling') {
            userAnswer = document.getElementById('spellingInput')?.value.trim() || '';
        }
        if (!userAnswer) {
            alert('请回答当前题目');
            return;
        }
        let isCorrect = false;
        if (q.type === 'en2zh_choice' || q.type === 'zh2en_choice') {
            isCorrect = (userAnswer === q.correctAnswer);
        } else if (q.type === 'spelling') {
            isCorrect = (userAnswer.toLowerCase() === q.correctAnswer.toLowerCase());
        }
        if (isCorrect) correctCount++;

        // 保存答题记录到本地数组
        const record = {
            questionIndex: currentIndex,
            wordId: q.wordId,
            questionType: q.type,
            questionContent: q.content,
            correctAnswer: q.correctAnswer,
            userAnswer: userAnswer,
            isCorrect: isCorrect,
            options: q.options || []
        };
        answerRecords.push(record);

        try {
            await fetch('/api/test/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: currentUser.userId,
                    wordId: q.wordId,
                    userAnswer: userAnswer,
                    correctAnswer: q.correctAnswer,
                    timestamp: Date.now()
                })
            });
        } catch (err) {
            console.error('记录失败', err);
        }

        currentIndex++;
        if (currentIndex < questions.length) {
            renderCurrentQuestion();
        } else {
            finishTest();
        }
    }

    async function finishTest() {
        if (!testActive) return;
        testActive = false;
        const total = questions.length;
        const correct = correctCount;  // 注意变量名，你原来用的是 correctCount
        const accuracy = total === 0 ? 0 : Math.round((correct / total) * 100);
        const endTime = Date.now();

        // 保存测试结果到后端
        try {
            await fetch('/api/test/saveResult', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: currentUser.userId,
                    questionType: currentQuestionType,
                    totalQuestions: total,
                    correctCount: correct,
                    startTime: testStartTime,
                    endTime: endTime,
                    sessionId: currentSessionId  // 传递 sessionId
                })
            });
        } catch (err) {
            console.error('保存测试结果失败', err);
        }

        // 保存测试结果和答题详情到 localStorage
        const testResult = {
            sessionId: currentSessionId,
            total: total,
            correct: correct,
            accuracy: accuracy,
            questionType: currentQuestionType,
            startTime: testStartTime,
            endTime: endTime,
            timestamp: Date.now(),
            answerRecords: answerRecords  // 包含每道题的详细信息
        };
        localStorage.setItem('latestTestResult', JSON.stringify(testResult));

        // 在后台异步保存答题记录（不等待完成，直接跳转）
        saveAnswerRecordsToBackend(currentSessionId, answerRecords);

        // 立即跳转到报告页面
        window.location.href = 'report.html?from=test';

        // 隐藏测试面板、显示设置面板（因为页面会跳转，这行其实可以不要，但保留也无妨）
        document.getElementById('testPanel').style.display = 'none';
        document.getElementById('setupPanel').style.display = 'block';
    }

    // 展示测试结果对话框
    function showTestResultDialog(total, correct, accuracy) {
        // 简单实现：模态框或 alert，此处用自定义弹窗
        const modalHtml = `
        <div id="resultModal" style="position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; justify-content:center; align-items:center; z-index:2000;">
            <div style="background:white; border-radius:16px; padding:24px; max-width:400px; text-align:center;">
                <h2 style="color:#667eea;">📊 测试结果</h2>
                <p style="font-size:24px; margin:20px 0;">${correct} / ${total}</p>
                <p style="font-size:18px;">正确率：${accuracy}%</p>
                <button onclick="closeResultModal()" style="margin-top:20px; padding:10px 30px; background:#667eea; color:white; border:none; border-radius:8px; cursor:pointer;">确定</button>
            </div>
        </div>
    `;
        document.body.insertAdjacentHTML('beforeend', modalHtml);
    }

    function closeResultModal() {
        const modal = document.getElementById('resultModal');
        if (modal) modal.remove();
    }

    // 异步保存答题记录到后端（使用 fetch keepalive 确保数据发送）
    async function saveAnswerRecordsToBackend(sessionId, records) {
        if (!sessionId || !records || records.length === 0) return;
        
        try {
            // 并行发送所有请求，提高速度
            const promises = records.map(record => {
                return fetch('/api/test/saveAnswerRecord', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sessionId: sessionId,
                        questionIndex: record.questionIndex,
                        wordId: record.wordId,
                        questionType: record.questionType,
                        questionContent: record.questionContent,
                        correctAnswer: record.correctAnswer,
                        userAnswer: record.userAnswer,
                        isCorrect: record.isCorrect,
                        optionsJson: JSON.stringify(record.options)
                    }),
                    keepalive: true  // 重要：允许在页面卸载后继续发送
                });
            });
            
            // 不等待结果，让请求在后台完成
            Promise.all(promises).then(() => {
                console.log('答题记录已保存到后端');
            }).catch(err => {
                console.error('保存答题记录失败', err);
            });
        } catch (err) {
            console.error('保存答题记录异常', err);
        }
    }

    // 修改 finishEarly 函数，调用 finishTest 时也保存
    function finishEarly() {
        if (testActive && confirm('确定要结束测试吗？')) {
            finishTest();
        }
    }

    window.onload = () => {
        currentUser = getCurrentUser();
        if (!currentUser) return;
        document.getElementById('startBtn').onclick = startTest;
        document.getElementById('submitBtn').onclick = submitAnswer;
        document.getElementById('finishBtn').onclick = finishEarly;
    };
</script>
</body>
</html>
